[project]
name = "stockportal"
version = "0.1.0"
description = "株価ポータル(スプリント1・ローカル版)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stockportal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
